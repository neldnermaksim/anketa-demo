<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Анкета предзаписи</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --ink:#1f2733; --muted:#6b7480; --line:#dfe3e8;
    --accent:#2f6fd6; --ok:#1e8a4c; --okbg:#e5f5eb; --warnbg:#fff4e0; --warn:#9a5b00;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:20px 16px 40px}
  .wrap{max-width:460px;margin:0 auto}
  h1{font-size:24px;font-weight:800;margin-bottom:6px}
  .sub{color:var(--muted);font-size:15px;margin-bottom:20px;line-height:1.4}
  .card{background:var(--card);border-radius:16px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
  label:first-child{margin-top:0}
  input{width:100%;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  input:focus{outline:none;border-color:var(--accent)}
  button{width:100%;margin-top:20px;font-size:17px;font-weight:700;padding:14px;border:none;border-radius:12px;background:var(--accent);color:#fff}
  .note{margin-top:14px;font-size:13px;color:var(--muted);text-align:center}
  .result{display:none;margin-top:16px}
  .ok{background:var(--okbg);color:var(--ok);font-weight:700;border-radius:12px;padding:14px 16px;margin-bottom:12px;font-size:16px}
  .warn{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:14px 16px;margin-bottom:12px;font-size:15px;line-height:1.4}
  .row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
  .row:last-child{border-bottom:none}
  .row span:first-child{color:var(--muted)}
  .row span:last-child{font-weight:700;text-align:right;word-break:break-all}
  .hl span:last-child{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <h1 style="margin-bottom:18px">Анкета предзаписи</h1>

  <form class="card" id="form" autocomplete="on">
    <label for="name">Имя</label>
    <input id="name" name="name" required>
    <label for="phone">Телефон</label>
    <input id="phone" name="phone" type="tel" placeholder="+7" required>

    <!-- скрытые поля: заполняются автоматически -->
    <input type="hidden" name="tg_id" id="tg_id">
    <input type="hidden" name="tg_username" id="tg_username">
    <input type="hidden" name="source" id="source">

    <button type="submit">Отправить</button>
  </form>

  <div class="result" id="result">
    <div id="status"></div>
    <div class="card">
      <div style="font-weight:800;margin-bottom:6px">Данные заявки</div>
      <div class="row"><span>Имя</span><span id="r_name"></span></div>
      <div class="row"><span>Телефон</span><span id="r_phone"></span></div>
      <div class="row hl"><span>Telegram ID</span><span id="r_id"></span></div>
      <div class="row hl"><span>Ник в Telegram</span><span id="r_user"></span></div>
      <div class="row hl"><span>Откуда ссылка</span><span id="r_src"></span></div>
    </div>
  </div>
</div>

<script>
  var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  var user = null, startParam = "";
  try {
    if (tg) {
      tg.ready();
      tg.expand();
      var d = tg.initDataUnsafe || {};
      user = d.user || null;
      startParam = d.start_param || "";
    }
    if (!startParam) {
      var q = new URLSearchParams(location.search);
      startParam = q.get("tgWebAppStartParam") || q.get("startapp") || "";
    }
  } catch (e) {}

  document.getElementById("tg_id").value = user ? String(user.id) : "";
  document.getElementById("tg_username").value = (user && user.username) ? "@" + user.username : "";
  document.getElementById("source").value = startParam;

  document.getElementById("form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var f = ev.target;
    document.getElementById("r_name").textContent = f.name.value;
    document.getElementById("r_phone").textContent = f.phone.value;
    document.getElementById("r_id").textContent = f.tg_id.value || "не определён";
    document.getElementById("r_user").textContent = f.tg_username.value || (user ? "нет ника" : "не определён");
    document.getElementById("r_src").textContent = f.source.value || "не указано";

    var st = document.getElementById("status");
    if (user) {
      st.innerHTML = '<div class="ok">✓ Заявка отправлена</div>';
    } else {
      st.innerHTML = '<div class="warn">Заявка отправлена. Telegram ID не определён: ссылка открыта не в Телеграме.</div>';
    }
    f.style.display = "none";
    document.getElementById("result").style.display = "block";
    window.scrollTo(0, 0);
    if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.notificationOccurred("success"); } catch (e) {} }
  });
</script>
</body>
</html>
